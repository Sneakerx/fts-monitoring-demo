[project]
name = "imf"
version = "0.1.0"
description = "Instrument Monitoring Facility (IMF) prototype for an EO Fourier-Transform Spectrometer"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2",
    "apscheduler>=3.10,<4",
    "numpy",
    "h5py",
    "matplotlib",
    "plotly",
    "httpx",
    "pyyaml",
    "itsdangerous",
    "python-multipart",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
imf = "imf.cli:main"

[project.entry-points."imf.algorithms"]
# External algorithm packages register their modules here, e.g.
# my_tool = "my_package.algorithms"

[tool.setuptools]
packages = ["imf", "pdgs_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
