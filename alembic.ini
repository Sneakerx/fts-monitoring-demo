# Development use only: `alembic revision --autogenerate -m "..."` / `alembic upgrade head`.
# At run time the IMF applies migrations itself (imf/migrate.py), also via `python -m imf.cli db migrate`.
[alembic]
script_location = imf/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/imf.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
